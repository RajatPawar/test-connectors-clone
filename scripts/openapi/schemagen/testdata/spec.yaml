openapi: 3.0.0
info: {title: t, version: "1"}
paths:
  /widgets:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Widget"}
    post:
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WidgetCreate"}
      responses:
        "201":
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Widget"}
  /gadgets:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: {type: string}
      responses:
        "202":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  label: {type: string}
components:
  schemas:
    Widget:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        price: {type: number}
        createdAt: {type: string, format: date-time}
        etag: {type: string, readOnly: true}
    WidgetCreate:
      type: object
      properties:
        name: {type: string}
        price: {type: number}
        secret: {type: string}
